<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neutrality in Order</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: "Segoe UI", Segoe, Arial, sans-serif; background: linear-gradient(135deg,#E8F6FB,#F4F9FC); color: #1a2340; padding: 12px; }
.widget { max-width: 680px; margin: 0 auto; background: #fff; border: 1px solid #C5DCE5; border-left: 5px solid #2196D0; border-radius: 10px; padding: 14px 18px 18px; }
.kicker { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: #1B6A94; margin-bottom: 4px; }
h1 { font-size: 18px; color: #0E1C42; margin: 0 0 4px; }
.hint { font-size: 13px; color: #555; margin-bottom: 12px; line-height: 1.45; }
.q { font-size: 15px; line-height: 1.5; color: #0E1C42; margin: 0 0 12px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts button, .chip { background: #fff; border: 1.5px solid #D0D9E8; border-radius: 8px; padding: 8px 12px; font-size: 14px; color: #0E1C42; cursor: pointer; font-family: inherit; text-align: left; line-height: 1.35; }
.opts button:hover, .chip:hover { background: #F4F6FA; border-color: #55C8E8; }
.opts button.selected { background: #0E1C42; color: #fff; border-color: #0E1C42; }
.opts button.correct { background: #D8F0DD; border-color: #2A9D5C; color: #1A6B3D; }
.opts button.incorrect { background: #FDECEC; border-color: #C0392B; color: #8A1F16; }
.opts button:disabled { cursor: default; }
.opts.stack button { flex: 1 1 100%; }
.opts.scale { flex-wrap: nowrap; }
.opts.scale button { flex: 1; text-align: center; font-size: 13px; }
.row { background: #FAFBFD; border: 1px solid #D0D9E8; border-radius: 6px; padding: 10px 12px; margin-bottom: 9px; }
.row-prompt { font-size: 14.5px; line-height: 1.45; margin-bottom: 8px; }
.fb { display: none; padding: 9px 12px; margin-top: 10px; font-size: 14px; line-height: 1.5; border-radius: 4px; background: #fff; border-left: 3px solid #C7922C; }
.fb.show { display: block; }
.fb.correct { background: #D8F0DD; border-left-color: #2A9D5C; color: #1A6B3D; }
.fb.incorrect { background: #FDECEC; border-left-color: #C0392B; color: #8A1F16; }
.reveal { font-size: 14px; line-height: 1.55; background: #FBF3E3; border-left: 4px solid #C7922C; border-radius: 6px; padding: 11px 14px; margin-top: 10px; }
.reveal .tag { display: block; font-weight: bold; text-transform: uppercase; font-size: 10.5px; letter-spacing: .04em; color: #8a6416; margin-bottom: 4px; }
.cards { display: flex; flex-wrap: wrap; gap: 10px; }
.flip { flex: 1 1 240px; min-height: 120px; background: #FAFBFD; border: 1px solid #D0D9E8; border-radius: 8px; padding: 14px 16px; cursor: pointer; font-size: 14.5px; line-height: 1.5; display: flex; align-items: center; justify-content: center; text-align: center; }
.flip:hover { border-color: #55C8E8; }
.flip .back { display: none; text-align: left; }
.flip.flipped { background: #EEF4FF; border-color: #2196D0; }
.flip.flipped .front { display: none; }
.flip.flipped .back { display: block; }
.tap { font-size: 11.5px; color: #1B6A94; display: block; margin-top: 6px; }
.pool { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; min-height: 38px; }
.chip { font-size: 13px; padding: 6px 10px; }
.label { font-size: 12px; color: #555; margin: 4px 0 6px; }
ol.slots { list-style: none; margin: 0 0 10px; padding: 0; }
ol.slots li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #FAFBFD; border: 1px solid #D0D9E8; border-radius: 6px; padding: 6px 10px; margin-bottom: 5px; font-size: 13.5px; cursor: pointer; }
ol.slots li .n { font-weight: bold; color: #1B6A94; min-width: 18px; }
ol.slots li.ok { background: #D8F0DD; border-color: #2A9D5C; cursor: default; }
ol.slots li.bad { background: #FDECEC; border-color: #C0392B; }
ol.slots li .note { flex: 1 1 100%; font-size: 12.5px; padding-left: 26px; }
ol.slots li.empty { cursor: default; color: #8a93a8; border-style: dashed; }
.go { background: #0E1C42; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13.5px; cursor: pointer; font-family: inherit; }
.go:disabled { background: #9aa3b8; cursor: default; }
.widget-reset { background: transparent; border: 1px solid #C7922C; color: #8a6416; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit; margin-top: 12px; }
.widget-reset:hover { background: #FDF3E3; }
.sim-banner { background: #FBF3E3; border: 1px dashed #C7922C; border-radius: 6px; padding: 7px 10px; font-size: 12.5px; color: #6b4e10; margin-bottom: 10px; }
.mode { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.mode label { display: flex; gap: 6px; align-items: center; font-size: 13.5px; background: #FAFBFD; border: 1px solid #D0D9E8; border-radius: 6px; padding: 7px 10px; cursor: pointer; flex: 1 1 250px; }
.slider-wrap { margin: 8px 0 12px; font-size: 14px; }
.slider-wrap input { width: 100%; }
.grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin: 8px 0; }
.bld { height: 34px; border-radius: 4px; border: 1px solid #9aa3b8; background: #e6e9f0; transition: background .25s, border-color .25s; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #44506b; }
.bld.ok { background: #bfe6c9; border-color: #2A9D5C; color: #1A6B3D; }
.bld.wait { background: #f8e3b8; border-color: #C7922C; color: #6b4e10; }
.bld.no { background: #f6cfcb; border-color: #C0392B; color: #8A1F16; }
.legend { font-size: 12px; color: #555; display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
.stat { font-size: 15px; color: #0E1C42; margin: 6px 0; }
@media (max-width: 480px) { .opts.scale { flex-wrap: wrap; } .opts.scale button { flex: 1 1 100%; } }

.pl-scale { display: flex; gap: 6px; flex-wrap: wrap; }
.pl-scale button { flex: 1 1 90px; background: #fff; border: 1.5px solid #D0D9E8; border-radius: 8px; padding: 8px 6px; font-size: 13px; color: #0E1C42; cursor: pointer; font-family: inherit; line-height: 1.3; }
.pl-scale button:hover { background: #F4F6FA; border-color: #55C8E8; }
.pl-scale button.selected { background: #0E1C42; color: #fff; border-color: #0E1C42; }
.qline { font-size: 13.5px; line-height: 1.4; margin: 8px 0 5px; color: #0E1C42; }
.yn { display: flex; gap: 8px; }
.yn button { flex: 0 1 110px; background: #fff; border: 1.5px solid #D0D9E8; border-radius: 8px; padding: 7px 10px; font-size: 14px; color: #0E1C42; cursor: pointer; font-family: inherit; }
.yn button:hover { background: #F4F6FA; border-color: #55C8E8; }
.yn button.selected { background: #0E1C42; color: #fff; border-color: #0E1C42; }
.yn button.correct { background: #D8F0DD; border-color: #2A9D5C; color: #1A6B3D; }
.yn button.incorrect { background: #FDECEC; border-color: #C0392B; color: #8A1F16; }
.cells10 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 6px 0 10px; }
.cells10 .cell { height: 22px; border-radius: 3px; border: 1px solid #c9d1e0; background: #eef1f6; transition: background .25s, border-color .25s; }
.cells10 .cell.on { background: #2A9D5C; border-color: #1A6B3D; }
.ends { display: flex; justify-content: space-between; font-size: 12px; color: #555; }
.meter-label { font-size: 13px; color: #0E1C42; margin: 10px 0 4px; }
.evlog { list-style: none; margin: 8px 0; padding: 0; }
.evlog li { font-size: 13.5px; line-height: 1.45; padding: 6px 10px; margin-bottom: 4px; background: #FAFBFD; border: 1px solid #D0D9E8; border-left: 4px solid #8a93a8; border-radius: 4px; }
.evlog li.now { border-left-color: #C7922C; background: #FBF3E3; }
.evlog li b { color: #8a6416; }
.note { font-size: 12px; color: #555; margin: 6px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
var SPEC = {
 "type": "seq",
 "kicker": "Try It Yourself",
 "title": "Neutrality in Order",
 "hint": "Each step tested neutrality a little further without yet breaking it.",
 "question": "Put these events in the order they happened.",
 "order": [
  3,
  1,
  4,
  0,
  2
 ],
 "done": "Every event is in place. Neutrality was strained again and again, and held, until early 1917.",
 "items": [
  {
   "text": "Wilson declares American neutrality",
   "why": "Right. August 4, 1914. He urged Americans to be \"impartial in thought as well as in action.\"",
   "hint": "This is the starting point for everything else in the lesson."
  },
  {
   "text": "A German submarine sinks the Lusitania",
   "why": "Right. May 1915. It killed nearly twelve hundred people, including 128 Americans.",
   "hint": "This is the first of the two sinkings, in 1915."
  },
  {
   "text": "Wilson answers with three increasingly firm protest notes",
   "why": "Right. He chose diplomacy over a declaration of war. Week 16 looked at Bryan's resignation over the second note.",
   "hint": "This was Wilson's response to the first sinking, so it comes right after it."
  },
  {
   "text": "A German submarine torpedoes the Sussex, and Germany promises to stop sinking merchant ships without warning",
   "why": "Right. March 1916. This time Wilson's protest won an actual concession.",
   "hint": "This is the second sinking, in 1916."
  },
  {
   "text": "Wilson campaigns for re-election on \"He kept us out of war\"",
   "why": "Right. The slogan came in the 1916 campaign, after neutrality had survived two sinkings.",
   "hint": "This slogan makes sense only after neutrality had survived the sinkings."
  }
 ]
};

(function () {
  var root = document.getElementById('app');
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  var E = {};

  E.reflect = function (w) {
    w.appendChild(el('div', 'q', SPEC.question));
    var opts = el('div', 'opts stack'); w.appendChild(opts);
    var fb = el('div', 'fb'); w.appendChild(fb);
    SPEC.options.forEach(function (o) {
      var b = el('button', null, o.label);
      b.onclick = function () {
        opts.querySelectorAll('button').forEach(function (x) { x.classList.remove('selected'); });
        b.classList.add('selected');
        fb.textContent = o.response + (SPEC.closing ? ' ' + SPEC.closing : '');
        fb.classList.add('show');
      };
      opts.appendChild(b);
    });
  };

  E.select = function (w) {
    w.appendChild(el('div', 'q', SPEC.question));
    SPEC.rows.forEach(function (r) {
      var row = el('div', 'row'); w.appendChild(row);
      row.appendChild(el('div', 'row-prompt', r.p));
      var opts = el('div', 'opts' + (SPEC.scale ? ' scale' : '')); row.appendChild(opts);
      var fb = el('div', 'fb'); row.appendChild(fb);
      r.o.forEach(function (label, i) {
        var b = el('button', null, label);
        b.onclick = function () {
          opts.querySelectorAll('button').forEach(function (x) { x.classList.remove('correct', 'incorrect'); });
          var right = i === r.c;
          b.classList.add(right ? 'correct' : 'incorrect');
          fb.className = 'fb show ' + (right ? 'correct' : 'incorrect');
          fb.textContent = right ? r.fb : (r.hints && r.hints[i]) || r.hint;
        };
        opts.appendChild(b);
      });
    });
  };

  E.cr = function (w) {
    w.appendChild(el('div', 'q', SPEC.question));
    var opts = el('div', 'opts stack'); w.appendChild(opts);
    var out = el('div'); w.appendChild(out);
    SPEC.options.forEach(function (label, i) {
      var b = el('button', null, label);
      b.onclick = function () {
        opts.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
        b.classList.add('selected');
        out.innerHTML = '';
        var mine = el('div', 'fb show', SPEC.notes[i]); out.appendChild(mine);
        var rv = el('div', 'reveal'); rv.appendChild(el('span', 'tag', SPEC.revealTag));
        rv.appendChild(document.createTextNode(SPEC.reveal)); out.appendChild(rv);
      };
      opts.appendChild(b);
    });
  };

  E.flip = function (w) {
    w.appendChild(el('div', 'q', SPEC.question));
    var cards = el('div', 'cards'); w.appendChild(cards);
    SPEC.cards.forEach(function (c) {
      var d = el('div', 'flip'); d.tabIndex = 0; d.setAttribute('role', 'button');
      var f = el('div', 'front'); f.appendChild(document.createTextNode(c.front)); f.appendChild(el('span', 'tap', 'Tap to flip'));
      var b = el('div', 'back', c.back);
      d.appendChild(f); d.appendChild(b);
      function t() { d.classList.toggle('flipped'); }
      d.onclick = t;
      d.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); t(); } };
      cards.appendChild(d);
    });
  };

  E.seq = function (w) {
    var items = SPEC.items, order = SPEC.order, placed = [], result = null;
    w.appendChild(el('div', 'q', SPEC.question));
    w.appendChild(el('div', 'label', 'Tap events below to build the timeline, earliest first. Tap a placed event to send it back.'));
    var pool = el('div', 'pool'); w.appendChild(pool);
    var slots = el('ol', 'slots'); w.appendChild(slots);
    var go = el('button', 'go', 'Check order'); w.appendChild(go);
    var sum = el('div', 'fb'); w.appendChild(sum);
    function draw() {
      pool.innerHTML = ''; slots.innerHTML = '';
      order.forEach(function (i) {
        if (placed.indexOf(i) < 0) {
          var c = el('button', 'chip', items[i].text);
          c.onclick = function () { placed.push(i); result = null; draw(); };
          pool.appendChild(c);
        }
      });
      for (var pos = 0; pos < items.length; pos++) {
        var li = el('li');
        if (pos < placed.length) {
          (function (p) {
            var idx = placed[p];
            li.appendChild(el('span', 'n', String(p + 1)));
            li.appendChild(el('span', null, items[idx].text));
            if (result) {
              var good = idx === p;
              li.className = good ? 'ok' : 'bad';
              li.appendChild(el('span', 'note', good ? items[idx].why : items[idx].hint));
            }
            li.onclick = function () { if (result && idx === p) return; placed.splice(p, 1); result = null; draw(); };
          })(pos);
        } else {
          li.className = 'empty';
          li.appendChild(el('span', 'n', String(pos + 1)));
          li.appendChild(el('span', null, 'empty'));
        }
        slots.appendChild(li);
      }
      go.disabled = placed.length !== items.length;
      if (!result) { sum.className = 'fb'; sum.textContent = ''; }
    }
    go.onclick = function () {
      result = placed.map(function (idx, p) { return idx === p; });
      var n = result.filter(Boolean).length;
      draw();
      sum.className = 'fb show ' + (n === items.length ? 'correct' : 'incorrect');
      sum.textContent = n === items.length ? SPEC.done : n + ' of ' + items.length + ' are in the right place. Read the notes on the red ones, send them back, and try again.';
    };
    draw();
  };

  

  function render() {
    root.innerHTML = '';
    var w = el('div', 'widget');
    w.appendChild(el('div', 'kicker', SPEC.kicker));
    w.appendChild(el('h1', null, SPEC.title));
    if (SPEC.hint) w.appendChild(el('div', 'hint', SPEC.hint));
    E[SPEC.type](w);
    var r = el('button', 'widget-reset', 'Reset'); r.onclick = render; w.appendChild(r);
    root.appendChild(w);
  }
  render();
})();

</script>
</body>
</html>
